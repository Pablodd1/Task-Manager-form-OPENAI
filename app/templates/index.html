<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Task Manager</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Team Task Manager</h1>
            <p class="subtitle">Assign, Track, and Review Tasks Efficiently</p>
        </header>

        <div class="task-form">
            <div class="form-group full-width">
                <input type="text" id="new-task-title" placeholder="Task Title" required>
            </div>
            <div class="form-group full-width">
                <input type="text" id="new-task-desc" placeholder="Description">
            </div>
            <div class="form-group">
                <input type="text" id="new-task-assignee" placeholder="Assignee Name">
            </div>
            <div class="form-group">
                <input type="email" id="new-task-email" placeholder="Assignee Email">
            </div>
            <div class="form-group">
                <input type="date" id="new-task-due">
            </div>
            <div class="form-group">
                <button id="add-task-btn">Add Task</button>
            </div>
        </div>

        <div id="tasks-container">
            <!-- Tasks will be injected here -->
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
